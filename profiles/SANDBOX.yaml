profile_id: SANDBOX
required_directories:
  - docs
  - schemas
optional_directories:
  - tests
  - planning
required_governance_artifacts:
  - governance/policies/ORA_CAPABILITY_BOUNDARY.md
required_validators:
  - tools/validate_repo_layout.py
branch_strategy: disposable
repo_sync_mode: none
initial_files:
  - README.md
prohibited_actions:
  - unrestricted_shell
  - deploy
  - autonomous_merge
escalation_triggers:
  - validation_failure
