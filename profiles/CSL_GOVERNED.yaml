profile_id: CSL_GOVERNED
required_directories:
  - governance
  - memory
  - planning
  - docs
  - schemas
optional_directories:
  - tests
required_governance_artifacts:
  - governance/constitution/AI_CONSTITUTION.md
  - governance/control_plane/DECISION_GATE.md
required_validators:
  - tools/validate_repo_layout.py
  - tools/validate_profiles.py
branch_strategy: governed_dev_main
repo_sync_mode: dev_main_packet_only
initial_files:
  - README.md
  - PROJECT_CONTEXT.md
  - ORA_SOURCE_CONTEXT_v1.0.0.md
prohibited_actions:
  - unrestricted_shell
  - deploy
  - autonomous_merge
  - self_modify_governance
escalation_triggers:
  - missing_authority
  - validation_failure
  - profile_ambiguity
